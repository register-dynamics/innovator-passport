{% extends 'layout.html' %}
{% block beforeContent %}
{{ backLink({
href: "dashboard",
text: "Back"
}) }}
{% endblock %}
{% block content %}

<form action="/form-handler" method="post" novalidate>
    <div class="nhsuk-form-group">
        <fieldset class="nhsuk-fieldset">
            <div class="nhsuk-form-group">
                <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--l">
                    <h1 class="nhsuk-fieldset__heading">
                        Document details
                    </h1>
                </legend>
                <label class="nhsuk-label" for="sort-by">
                    Select form type
                </label>
                <select class="nhsuk-select" id="sort-by" name="sortBy">
                    <option value="recently-published" selected>DTAC</option>
                    <option value="recently-updated">PAQ</option>
                    <option value="most-views">certificate</option>
                    <option value="most-comments">Other</option>
                </select>
            </div>
            <div class="nhsuk-form-group">
                <label class="nhsuk-label" for="address-line-1">
                    Select visibility
                </label>
                <div class="nhsuk-radios" data-module="nhsuk-radios">
                    <div class="nhsuk-radios__item">
                        <input class="nhsuk-radios__input" id="example-hints" name="exampleHints" type="radio"
                            value="email">
                        <label class="nhsuk-label nhsuk-radios__label" for="example-hints">
                            Public <span class="nhsuk-u-secondary-text-colour">(Anyone on the Innovator passport service
                                can view this file)</span>
                        </label>
                    </div>
                    <div class="nhsuk-radios__item">
                        <input class="nhsuk-radios__input" id="example-hints-2" name="exampleHints" type="radio"
                            value="phone">
                        <label class="nhsuk-label nhsuk-radios__label" for="example-hints-2">
                            Internal <span class="nhsuk-u-secondary-text-colour">(Anyone from your company can view this
                                file)</span>
                        </label>
                    </div>
                    <div class="nhsuk-radios__item">
                        <input class="nhsuk-radios__input" id="example-hints-3" name="exampleHints" type="radio"
                            value="text">
                        <label class="nhsuk-label nhsuk-radios__label" for="example-hints-3">
                            Private <span class="nhsuk-u-secondary-text-colour">(Only you can view this file)</span>
                        </label>
                    </div>
                </div>
            </div>
        </fieldset>
    </div>


    <div class="nhsuk-form-group nhsuk-file-upload" data-module="nhsuk-file-upload">
        <input class="nhsuk-file-upload__input" id="file-hint" name="file-hint" type="file">
    </div>

    <button href="upload.html" class="nhsuk-button" data-module="nhsuk-button" type="submit">
        Upload
    </button>
    {% endblock %}
